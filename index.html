<script>
// Stonesong: Pocket Six's DX7 voices, sampled on the device. The picks live in
// dx7voices.js (one palette per kind of world) and the engine is Pocket Six's own FM code
// (pocketsix-dsp.js). Each voice is played once per octave into a buffer, a second or two of
// work spread over frames; after that a note is just a buffer played at the right speed, so a
// swarm of thousands costs no more than the plain synth voices. Runs offline under Node too.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ = root.PQ || {};

  const ROOTS = [36, 48, 60, 72, 84];                       // one take per octave; notes between are resampled
  // How long the key is held, and the longest take, per role (seconds). Plucks are let go at once.
  const HOLD = { venom: 2.2, drill: 2.0, seeker: 1.0, tap: 0.6, midas: 0.4, bomb: 0.3 };
  const MAX = { venom: 5, drill: 5, midas: 5, seeker: 3.5, spark: 3, lancer: 3, bomb: 3, tap: 3.5, pebble: 2.5 };

  function makeProc(FM, sr) {
    let Proc = null;
    class PageProcessor { constructor() { this.port = { onmessage: null, postMessage() {} }; } }
    FM(sr, PageProcessor, (name, cls) => { Proc = cls; });
    return new Proc();
  }

  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
  const pause = () => new Promise(r => setTimeout(r, 0));

  // Sample one palette. Returns { role: [{ root, buf }] }, each role scaled so its middle take's
  // first second and a half is about -20 dBFS RMS: patches differ wildly in level, this evens them.
  async function sample(ctx, palette, onProgress) {
    const FM = root.FM_DSP;
    if (!FM) throw new Error('Pocket Six engine missing');
    const p = makeProc(FM, ctx.sampleRate), roles = Object.keys(palette.voices), out = {};
    let done = 0;
    const tick = () => { if (onProgress) onProgress(++done / (roles.length * ROOTS.length)); };
    for (const role of roles) out[role] = await takesOf(ctx, p, palette.voices[role], role, tick);
    return out;
  }

  // Sample a single patch, played the way `role` plays (how long the key is held), for a ball
  // the player gave a voice of its own.
  async function sampleVoice(ctx, patch, role) {
    const FM = root.FM_DSP;
    if (!FM) throw new Error('Pocket Six engine missing');
    return takesOf(ctx, makeProc(FM, ctx.sampleRate), patch, role);
  }

  // Every voice in the palettes, once each, for the per-ball picker. id is the patch's source
  // (stable across rebuilds of dx7voices.js); role is the one it was picked for, which sets how
  // it is played and how loud it sits; group is a family name for the menu.
  const FAMILY = { pebble: 'Mallets', lancer: 'Harps and plucks', bomb: 'Drums', venom: 'Voices and pads',
    spark: 'Chimes and glass', midas: 'Bells', drill: 'Strings', seeker: 'Winds', tap: 'Keys' };
  function pretty(name) {
    return name.replace(/\s+/g, ' ').trim().replace(/\bSECN\b/, 'SECTION').split(' ')
      .map(w => w.length <= 2 || /\d/.test(w) ? w : w.toLowerCase().replace(/(^|[.-])(\w)/g, (_, a, b) => a + b.toUpperCase())).join(' ');
  }
  let cat = null;
  function catalog() {
    if (cat) return cat;
    cat = [];
    const names = {};
    for (const pal of root.PQ.DX7_PALETTES || []) {
      for (const role in pal.voices) {
        const patch = pal.voices[role], id = patch.from || pal.name + ':' + role;
        if (cat.some(v => v.id === id)) continue;
        let name = pretty(patch.name || role);
        const key = name.toLowerCase();
        names[key] = (names[key] || 0) + 1;
        if (names[key] > 1) name += ' ' + names[key];
        cat.push({ id, name, role, group: FAMILY[role] || 'Other', patch });
      }
    }
    return cat;
  }

  async function takesOf(ctx, p, patch, role, tick) {
    const sr = ctx.sampleRate;
    const L = new Float32Array(128), R = new Float32Array(128), outs = [[L, R]];
    let last = now();
    p.msg({ t: 'panic' });
    p.msg({ t: 'poly', n: 2 });
    p.msg({ t: 'patch', p: patch });
    p.fx = null;                                           // dry: the game has its own room and echo
    const shift = (patch.trnp == null ? 24 : patch.trnp) - 24;
    const takes = [];
    let peak = 0;
    for (const m of ROOTS) {
      const hold = (HOLD[role] || 0.25) * sr, max = Math.floor((MAX[role] || 3) * sr);
      const data = new Float32Array(max);
      let n = 0, quiet = 0, off = false;
      p.msg({ t: 'on', note: m, vel: 0.85 });
      while (n < max) {
        p.process(null, outs);
        const k = Math.min(128, max - n);
        let pk = 0;
        for (let i = 0; i < k; i++) { data[n + i] = L[i]; const a = Math.abs(L[i]); if (a > pk) pk = a; }
        n += k;
        if (pk > peak) peak = pk;
        if (!off && n >= hold) { p.msg({ t: 'off', note: m }); off = true; }
        if (off) { quiet = pk < 2e-4 ? quiet + k : 0; if (quiet > sr * 0.05) break; }
        if (now() - last > 24) { await pause(); last = now(); }
      }
      p.msg({ t: 'panic' });
      for (let i = 0; i < 4; i++) p.process(null, outs);
      takes.push({ root: m + shift, data: data.subarray(0, n) });
      if (tick) tick();
    }
    const mid = takes.find(t => t.root - shift === 60) || takes[0], win = Math.min(mid.data.length, Math.floor(sr * 1.5));
    let ss = 0;
    for (let i = 0; i < win; i++) ss += mid.data[i] * mid.data[i];
    const rms = Math.sqrt(ss / Math.max(1, win));
    const g = rms > 0 ? Math.min(0.1 / rms, 3 / Math.max(peak, 1e-9)) : 1, fade = Math.floor(sr * 0.02);
    return takes.map(t => {
      const buf = ctx.createBuffer(1, t.data.length, sr), d = buf.getChannelData(0);
      for (let i = 0; i < t.data.length; i++) d[i] = t.data[i] * g;
      for (let i = 0; i < fade && i < d.length; i++) d[d.length - 1 - i] *= i / fade;
      return { root: t.root, buf };
    });
  }

  PQ.DX7 = { sample, sampleVoice, catalog, ROOTS };
})();

<script>
// Stonesong: the music. Every ball type is an instrument and every pixel is a note.
// A pixel's note is fixed by where it sits (a hash of x, y) and how high it rings by what it is

    const rel = sim.w.relics, v = this.view, cx = (v.x0 + v.x1) / 2, cy = (v.y0 + v.y1) / 2;
    let bi = -1, bd = Infinity;
    for (let i = 0; i < rel.length; i++) {
      const r = rel[i], dx = (r.x0 + r.x1) / 2 - cx, dy = (r.y0 + r.y1) / 2 - cy, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; bi = i; }
    }
    if (bi < 0) return this.zone;
    const h = hash(bi + 1, sim.w.seed | 0);
    return {
      i: bi,
      room: 0.6 + (h & 255) / 255 * 0.9,                // reverb, x
      echo: [2, 3, 3, 4, 6][(h >>> 8) % 5],             // echo time, steps
      fb: 0.22 + ((h >>> 11) & 63) / 63 * 0.28,         // echo repeats
      tint: ((h >>> 17) % 3) - 1,                       // mode one step brighter or darker
      deg: 7 + (h >>> 20) % 9,                          // the scale tone the region rings at
    };
  };

  // ---- bars: chords, mood, and the mix ----
  E.newBar = function (t0, bar, sim, theming) {
    // Patterns turn now and then, so the same swarm never loops. Spin turns them faster.
    const st = this.style;
    const turn = Math.max(st.turn || 0, 0.05 + 0.6 * this.spin);
    for (let t = 0; t < NB; t++) if (this.rnd() < turn) this.rot[t] = (this.rot[t] + 1 + Math.floor(this.rnd() * 3)) % STEPS;
    if (sim && !sim.s.found && bar % 2 === 0) {
      let seekers = 0;
      for (let k = 0; k < sim.n; k++) if (sim.bt[k] === I.seeker) { seekers = 1; break; }
      if (seekers) this.gold = clamp(sim.goldDistance() / D.RADAR.range, 0, 1);
    }
    if (sim) this.zone = this.zoneOf(sim);
    const zn = this.zone;
    if (bar % st.chordBars === 0 && !theming) {
      const opts = NEXT[this.chord];
      if (bar === 0) this.chord = 0;
      else if (this.tension > 0.45) {
        // Close to a story: the chords climb ii, IV, V, and from V start the climb again.
        const up = [1, 3, 4].filter(c => c > this.chord);
        this.chord = up.length ? up[Math.floor(this.rnd() * up.length)] : [1, 3][Math.floor(this.rnd() * 2)];
      } else this.chord = opts[Math.floor(this.rnd() * opts.length)];
      // The rock being dug sets the mode: surface rock bright, deep rock dark.
      let sum = 0, w = 0;
      for (let m = 1; m < this.matRate.length; m++) { sum += this.matRate[m] * MAT_DEPTH[m]; w += this.matRate[m]; }
      if (st.modes) this.mode = Math.floor(this.rnd() * MODES.length);
      else if (w > 0) this.mode = clamp(Math.round(sum / w * 0.6) + zn.tint, 0, MODES.length - 1);
      this.padChord(t0, this.stepDur * STEPS * st.chordBars);
      this.retuneDrone(t0);

      if (bar % 16 === 8 && this.known() >= 3 && this.tension < 0.3 && this.rnd() < 0.45) {
        this.playTheme(t0 + this.stepDur * 4, this.known(), { lead: I.seeker, vel: 0.5, harmony: false });

    }
    // The blend: more voices at once, each one quieter; busier and further out, darker and wetter.
    const busy = INST.reduce((n, _, t) => n + (this.rate[t] > 0.3 ? 1 : 0), 0);
    const each = 1 / Math.sqrt(Math.max(1, busy));
    for (let t = 0; t < INST.length; t++) {
      const g = t === TAP ? 1 : t === I.bomb && !this.drums ? each * 0.5 : each;
      this.bus[t].gain.setTargetAtTime(g, t0, 1.5);
    }
    const z = clamp((Math.log2(this.view.z) + 2.3) / 7.6, 0, 1);    // 0 = whole world in view, 1 = close up

    const at = this.atmos;
    const fx = 3000 * this.glass + 1500 * (this.rush - 1) / 0.35;
    this.tone.frequency.setTargetAtTime(clamp(((3000 + 9000 * z) * calm + 4000 * ten + 500 * lift + fx) * at.tone, 1200, 14000), t0, 1.5);
    // Zoomed in, the region's room takes over; zoomed out, the whole map blends.
    const room = 1 + (zn.room - 1) * z;
    this.verbOut.gain.setTargetAtTime((0.55 + 0.6 * (1 - z)) * room, t0, 2);
    this.delay.delayTime.setTargetAtTime(this.stepDur * (z > 0.4 ? zn.echo : 3), t0, 0.8);
    this.fb.gain.setTargetAtTime(st.fb || 0.38 + (zn.fb - 0.38) * z, t0, 1);
    this.res.frequency.setTargetAtTime(mtof(this.midi(zn.deg)), t0, 1.5);
    this.res.gain.setTargetAtTime(6 * z, t0, 2);
    const bed = this.total > 0.5 ? 0.05 + 0.07 * clamp(Math.log10(1 + this.total) / 3, 0, 1) + 0.006 * lift : 0;
    this.padGain.gain.setTargetAtTime(bed + 0.09 * ten, t0, 2);
    this.padLp.frequency.setTargetAtTime(500 + 1600 * clamp(this.poison / 3000, 0, 1) + 2400 * ten + 150 * lift, t0, 2);
    this.shimmer.gain.setTargetAtTime(0.05 * Math.pow(ten, 1.5) + 0.004 * lift + 0.012 * at.air + 0.04 * this.shine, t0, 2.5);
    this.heart.gain.setTargetAtTime(this.drums ? 1 : 0, t0, 0.5);

  };

  // Hold the chord in the bed for one chord's length, crossfading from the last.
  E.padChord = function (t0, len) {
    const ctx = this.ctx, degs = [this.chord - 7, this.chord - 5, this.chord - 3, this.chord + 1];
    const end = t0 + len + 3;
    for (const d of degs) {
      const f = mtof(this.midi(d));
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.25, t0 + Math.min(2.5, len * 0.5));
      g.gain.setValueAtTime(0.25, t0 + len);
      g.gain.linearRampToValueAtTime(0, end);

        const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
        let to = g;
        if (ctx.createStereoPanner) { const pn = ctx.createStereoPanner(); pn.pan.value = det > 0 ? 0.7 : -0.7; pn.connect(g); to = pn; }

    for (const d of [this.chord + 7, this.chord + 9, this.chord + 11, this.chord + 13]) {

      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.2, t0 + Math.min(2.5, len * 0.5));
      g.gain.setValueAtTime(0.2, t0 + len);
      g.gain.linearRampToValueAtTime(0, end);

  // Play the first `count` notes of the chapter's theme from t0. lead/double: instruments for
  // the melody and an octave above it. harmony: a chord under every half bar (the conductor's
  // chords follow it while it plays), a low root on each bar, and the bed moving with it.
  E.playTheme = function (t0, count, o) {

  // Game moments: a rising arpeggio for ◆, a bloom for relics, the theme for a story, a finale for the gold.
  E.flourish = function (e, t0) {
    const bell = INST[I.midas], glass = INST[I.lancer], c = this.chord, sd = this.stepDur;
    if (e.type === 'dia') {

    } else if (e.type === 'relic' && e.frag >= 0) {
      // A story found: the strong point. Up a fourth into a new key, a low swell under a long
      // strum, a rush of wind, the tension let go, and then the theme as far as it is known.
      this.tension = 0;
      this.glow = 1;
      this.tonic += 5; if (this.tonic > 69) this.tonic -= 12;
      this.chord = 0;
      const js = this.sim && this.sim.s.journal;
      this.found = js ? (js[this.sim.s.depth] || []).length : Math.max(this.found, 0) + 1;
      this.padChord(t0, this.stepDur * STEPS * BARS_PER_CHORD);
      this.gust = 2.5;
      this.blow(t0);
      if (this.drums) this.note(t0, this.midi(-14), 1, 0, INST[I.bomb], I.bomb, 1, false, true);
      [-7, -3, 0].forEach((o, i) => this.note(t0 + 0.05 + i * 0.04, this.midi(o), 0.9, (i - 1) * 0.6, INST[I.drill], I.drill, 1.4, false, true));
      [0, 2, 4, 6, 7, 9, 11, 14].forEach((o, i) => this.note(t0 + 0.3 + i * 0.09, this.midi(o + 7), 0.8, -0.9 + i * 0.26, bell, I.midas, 1.1, false, true));
      const whole = this.found >= this.fragments;
      const t1 = t0 + sd * 16;
      const end = this.playTheme(t1, whole ? this.theme.length : this.known(), { lead: I.drill, double: this.found * 2 >= this.fragments ? I.seeker : null, vel: 0.85, harmony: true });

      if (whole) this.playTheme(end + sd * 4, this.theme.length, { lead: I.seeker, double: I.lancer, vel: 0.9, harmony: true });
    } else if (e.type === 'relic') {
      [0, 2, 4, 6].forEach((o, i) => this.note(t0 + i * 0.05, this.midi(c + o), 0.7, -0.5 + i * 0.3, bell, I.midas, 0.7, false));
    } else if (e.type === 'gold') {

      // then the last chord rung out and held.
      this.glow = 1; this.tension = 0; this.gust = 2;
      const roll = 10;
      for (let i = 0; i < roll; i++) this.note(t0 + i * sd * 0.5, this.midi(this.chord - 14), 0.3 + 0.7 * i / roll, (i % 2 ? -0.3 : 0.3), INST[I.bomb], I.bomb, 1, false, true);
      const t1 = t0 + roll * sd * 0.5;
      this.chord = 0;
      const end = this.playTheme(t1, this.theme.length, { lead: I.drill, double: I.seeker, vel: 0.95, harmony: true, slow: 1.3 });
      [-7, -3, 0, 2, 4, 7, 9, 11, 14].forEach((o, i) => this.note(end + i * 0.08, this.midi(o), 0.9, -0.8 + i * 0.2, bell, I.midas, 1.2, false, true));
      this.note(end, this.midi(-14), 1, 0, INST[I.bomb], I.bomb, 1, false, true);
      this.padChord(end, 6);
      this.themeEnd = end + 6;

    } else if (e.type === 'clear') {
      [-7, -3, 0, 2, 4, 7, 9, 11].forEach((o, i) => this.note(t0 + i * 0.07, this.midi(c + o), 0.9, -0.7 + i * 0.2, bell, I.midas, 1, false, true));

  };

  // ---- timed world effects (sim.buyEffect) ----
  // A band of noise swept from f0 to f1 Hz: risers, falls, wind through the whirlpool, thunder.
  E.whoosh = function (t0, dur, f0, f1, level, q, pan) {
    const ctx = this.ctx;

    const src = ctx.createBufferSource(); src.buffer = this.nz; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = q ? 'bandpass' : 'lowpass'; bp.Q.value = q || 0.7;

  };
  // Each effect has a sound for its start and its end, and some colour the mix while they run.
  E.effect = function (key, on, t0) {
    const c = this.chord, bell = INST[I.midas];
    const run = (ins, t, offs, gap, vel, oct) => offs.forEach((o, i) =>
      this.note(t0 + i * gap, this.midi(c + o + 7 * (oct == null ? ins.oct : oct)), vel, -0.8 + 1.6 * i / Math.max(1, offs.length - 1), ins, t, 1.1, false, true));
    if (key === 'rush') {
      this.rush = on ? 1.35 : 1;
      this.setBpm(this.bpm);
      if (on) { this.whoosh(t0, 0.9, 250, 5000, 0.16, 1.2); run(INST[I.lancer], I.lancer, [0, 2, 4, 7, 9, 11, 14], 0.05, 0.7); }
      else this.whoosh(t0, 1.2, 4000, 250, 0.1, 1.2);
    } else if (key === 'recall' && on) {
      // Breath in, then everything at once: every instrument on the chord, in one stroke.
      this.whoosh(t0, 0.55, 3000, 300, 0.14, 1.5);
      const t1 = t0 + 0.55;
      [[I.pebble, 0], [I.lancer, 2], [I.midas, 4], [I.spark, 7], [I.seeker, 4], [I.venom, 0]].forEach(([t, o], i) =>
        this.note(t1 + i * 0.012, this.midi(c + o + 7 * INST[t].oct), 0.85, -0.6 + i * 0.24, INST[t], t, 1.2, false, true));

      if (on) { this.whoosh(t0, 2.4, 180, 1400, 0.12, 2, -0.6); this.whoosh(t0 + 0.6, 2.4, 1400, 220, 0.1, 2, 0.6); this.gust = 2; }

    } else if (key === 'shine') {
      this.shine = on ? 1 : 0;
      if (on) run(bell, I.midas, [0, 2, 4, 6, 7, 9, 11, 14], 0.11, 0.8, 1);
      else run(bell, I.midas, [7, 4, 0], 0.2, 0.5, 1);
    } else if (key === 'glass') {
      this.glass = on ? 1 : 0;
      if (on) run(INST[I.spark], I.spark, [14, 11, 9, 7, 4, 2, 0, -3], 0.06, 0.9);

      this.storm = on ? 1 : 0;
      // Thunder: a low roll that takes its time, and a crack on top when it begins.
      if (on) { this.whoosh(t0, 0.25, 6000, 900, 0.12, 0.8); this.whoosh(t0 + 0.1, 3.5, 200, 60, 0.5); }

    }
  };

  PQ.Audio = { Engine, INST, MODES, ATMOS, STYLES, hash, euclid, makeTheme };
})();

<script>
// Stonesong: everything between the game and the music engine (audio.js).
// Starting audio on the first tap, one engine per world (fading the last one out), Pocket Six
// voices sampled in the background, the sound settings, tilt, playing along with a finger,
// and Listen mode: the screen to itself, the camera drifting, a sleep timer and a recorder.
(function () {
  const PQ = window.PQ, D = PQ.DATA;
  const $ = id => document.getElementById(id);
  const DEFAULTS = { sound: true, vol: 0.8, voices: 'dx7', style: 'drift', drums: true, gravity: 0.5, spin: 0.3, tilt: false };

  PQ.Music = function (game) {
    const m = { ctx: null, eng: null, seed: null, banks: {}, listening: false };
    const st = () => {
      const s = game.state.settings;
      for (const k in DEFAULTS) if (s[k] == null) s[k] = DEFAULTS[k];
      if (!s.voiceFor) s.voiceFor = {};                    // ball type: 'auto' | 'synth' | 'off' | voice id
      return s;
    };
    const on = () => !!game.state && st().sound !== false;

    // ---- the engine ----
    function attach() {
      const old = m.eng, s = st(), depth = game.state.depth || 0;
      if (old) {
        // Its finale is already scheduled: let it play out, then fade the old world away.
        const left = Math.max(0, old.themeEnd - m.ctx.currentTime) * 1000;
        old.droneOff();
        setTimeout(() => old.fadeOut(3), left);
        setTimeout(() => { try { old.master.disconnect(); } catch (e) { /* gone */ } }, left + 5000);
      }
      const ch = PQ.storyChapter ? PQ.storyChapter(depth) : null;
      m.eng = new PQ.Audio.Engine(m.ctx, {
        seed: game.world.seed, depth, fragments: ch ? ch.fragments.length : 10,
        volume: s.vol, drums: s.drums, gravity: s.gravity, spin: s.spin, style: s.style,
      });
      m.seed = game.world.seed;
      // Light the cave where each note sounds, when it reaches the ear.
      m.eng.onNote = (t, when, x, y, vel) => {
        const r = game.renderer, lat = m.ctx.outputLatency || m.ctx.baseLatency || 0;
        if (r) r.ping(x + 0.5, y + 0.5, t, vel, Math.max(0, when - m.ctx.currentTime + lat));
      };
      if (m.rec) m.eng.out.connect(m.rec.dest);
      game.sim.snd = on() ? m.eng : null;
      loadVoices();
      for (const role in st().voiceFor) applyVoice(role);
    }
    // Pocket Six's voices for this kind of world, sampled once per visit and kept.
    function loadVoices() {
      const eng = m.eng, pal = eng.palette;
      if (st().voices !== 'dx7' || !PQ.DX7 || !PQ.DX7_PALETTES || !window.FM_DSP) { eng.setBank(null); return; }
      if (!m.banks[pal]) m.banks[pal] = PQ.DX7.sample(m.ctx, PQ.DX7_PALETTES[pal]).catch(() => null);
      m.banks[pal].then(bank => { if (m.eng === eng && st().voices === 'dx7') eng.setBank(bank); });
    }
    // ---- each ball type's own voice ----
    // Any voice from any palette, sampled on first use and kept for the session. 'auto' follows
    // the world; a picked voice sits at a level between its own role's and this ball type's.
    m.custom = {};
    const INST = PQ.Audio.INST, roleOf = r => INST.find(i => i.name === r);
    function applyVoice(role) {
      const eng = m.eng, want = st().voiceFor[role] || 'auto';
      if (!eng) return Promise.resolve();
      if (want === 'auto') { eng.setVoice(role, null); return Promise.resolve(); }
      if (want === 'off' || want === 'synth') { eng.setVoice(role, want); return Promise.resolve(); }
      const v = PQ.DX7 && window.FM_DSP && PQ.DX7.catalog().find(c => c.id === want);
      if (!v) { eng.setVoice(role, null); return Promise.resolve(); }
      if (!m.custom[want]) m.custom[want] = PQ.DX7.sampleVoice(m.ctx, v.patch, v.role).catch(() => null);
      return m.custom[want].then(takes => {
        if (m.eng !== eng || st().voiceFor[role] !== want) return;
        const level = Math.sqrt(roleOf(v.role).samp / roleOf(role).samp);
        eng.setVoice(role, takes, level);
      });
    }
    // Change one ball type's voice, then let it play a few notes alone so it can be heard.
    m.setVoice = function (role, id) {
      st().voiceFor[role] = id;
      if (!m.eng) return;
      applyVoice(role).then(() => { if (m.eng && on()) m.eng.preview(INST.findIndex(i => i.name === role)); });
    };
    // What 'auto' plays for a ball type in this world, for the menu.
    m.autoName = function (role) {
      if (st().voices !== 'dx7' || !PQ.DX7) return 'simple synth';
      const pal = PQ.DX7_PALETTES[(game.state.depth || 0) % PQ.DX7_PALETTES.length], p = pal && pal.voices[role];
      const v = p && PQ.DX7.catalog().find(c => c.id === p.from);
      return v ? v.name : 'this world’s';
    };

    m.start = function () {
      if (!game.sim || !on()) return;
      try {
        if (!m.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* older iOS */ }
          m.ctx = new AC({ latencyHint: 'playback' });
        }
        if (m.ctx.state !== 'running' && !m.slept) m.ctx.resume();
        if (!m.eng || m.seed !== game.world.seed) attach();
        game.sim.snd = m.eng;
      } catch (e) { /* no audio here */ }
    };
    // A new world: a new key, new instruments for its depth; the old one fades out.
    m.newWorld = function () { if (m.ctx) attach(); };

    // ---- settings ----
    m.set = function (key, v) {
      const s = st();
      s[key] = v;
      const e = m.eng;
      if (key === 'sound') {
        if (v) m.start();
        else { if (game.sim) game.sim.snd = null; if (m.ctx) m.ctx.suspend(); }
        if (m.muteButton) m.muteButton();
      }
      if (!e) return;
      if (key === 'vol') e.setVolume(v);
      if (key === 'drums') e.drums = v;
      if (key === 'gravity') e.gravity = v;
      if (key === 'spin') e.spin = v;
      if (key === 'style') e.setStyle(v);
      if (key === 'voices') loadVoices();
      if (key === 'tilt') tilt(v);
    };

    // ---- tilt: the Tombola in your hand ----
    // Lean the phone left or right and the whole field leans with it; tip it toward you or away
    // and the music thins out or fills in (the OP-1's gravity). iPhones ask permission first.
    let tiltOn = false;
    function onTilt(ev) {
      if (!m.eng || ev.gamma == null) return;
      m.eng.setTilt(ev.gamma / 45);
      if (ev.beta != null) m.eng.gravity = Math.min(1, Math.max(0, (ev.beta - 15) / 55));
    }
    async function tilt(want) {
      if (want && !tiltOn) {
        try {
          const DO = window.DeviceOrientationEvent;
          if (DO && typeof DO.requestPermission === 'function' && await DO.requestPermission() !== 'granted') throw new Error('denied');
          window.addEventListener('deviceorientation', onTilt);
          tiltOn = true;
        } catch (e) {
          st().tilt = false;
          if (game.ui) { game.ui.toast('Tilt needs motion access. Allow it when asked, or use the sliders.', 3600); game.ui.buildWorld(); }
        }
      } else if (!want && tiltOn) {
        window.removeEventListener('deviceorientation', onTilt);
        tiltOn = false;
        if (m.eng) { m.eng.setTilt(0); m.eng.gravity = st().gravity; }
      }
    }

    // ---- playing along ----
    function rockAt(p) {
      const x = Math.floor(p.x), y = Math.floor(p.y);
      if (x < 0 || y < 0 || x >= D.W || y >= D.H) return null;
      const mat = game.world.cells[y * D.W + x] & D.TYPE_MASK;
      return mat && game.sim.seen(x, y) ? { x, y, mat } : null;
    }
    m.tap = function (x, y, mat) { if (game.sim.snd) game.sim.snd.tap(x, y, mat); };
    m.holdStart = function (p) { const r = rockAt(p); if (r && game.sim.snd) game.sim.snd.droneOn(r.x, r.y, r.mat); };
    m.slide = function (p) { const r = rockAt(p); if (r && game.sim.snd) game.sim.snd.strum(r.x, r.y, r.mat); };
    m.holdEnd = function () { if (m.eng) m.eng.droneOff(); };

    // ---- every frame ----
    m.frame = function (dt) {
      const sim = game.sim, r = game.renderer;
      if (m.listening) drift(dt);
      if (!sim.snd || !m.ctx) return;
      const c = r.cam, hw = r.cssW / 2 / c.z, hh = r.cssH / 2 / c.z;
      sim.snd.setView(c.x - hw, c.y - hh, c.x + hw, c.y + hh, c.z);
      const e = sim.snd;
      e.frame(dt, m.ctx.currentTime, sim);
      // The next beat (every 4th step) as it reaches the ear, for the Pulse; and the chord.
      const lat = m.ctx.outputLatency || m.ctx.baseLatency || 0;
      sim.syncBeat(e.next + ((4 - e.step % 4) % 4) * e.stepDur - m.ctx.currentTime + lat, e.stepDur * 4, e.chord);
      if (m.listening) listenTick();
    };
    m.event = function (e) { if (game.sim.snd) game.sim.snd.event(e); };
    m.hidden = function (h) {
      if (!m.ctx) return;
      if (h) { m.ctx.suspend(); if (m.eng) m.eng.droneOff(); }
      else if (on() && !m.slept) m.ctx.resume();
    };

    // ---- Listen mode ----
    // The HUD and shop step aside and the camera wanders on its own: over the swarm, out to the
    // whole map, in toward a story relic not yet found. A tap brings the controls back.
    const cam = { t: 0, x: 0, y: 0, z: 3, idle: 0 };
    function pickShot() {
      const sim = game.sim, w = game.world, r = game.renderer, rnd = Math.random();
      cam.t = 18 + Math.random() * 14;
      if (rnd < 0.2) { cam.x = D.W / 2; cam.y = D.H / 2; cam.z = r.minZoom() * 1.6; return; }
      if (rnd < 0.45) {
        const hidden = w.relics.map((rl, i) => i).filter(i => sim.story[i] >= 0 && !sim.relicSeen.has(i));
        if (hidden.length && sim.n) {
          // The hidden story relic nearest a ball: where the music is about to rise.
          let best = hidden[0], bd = Infinity;
          for (const i of hidden) {
            const rl = w.relics[i], cx = (rl.x0 + rl.x1) / 2, cy = (rl.y0 + rl.y1) / 2;
            for (let k = 0; k < sim.n; k += Math.max(1, sim.n >> 6)) { const d = Math.hypot(sim.bx[k] - cx, sim.by[k] - cy); if (d < bd) { bd = d; best = i; } }
          }
          const rl = w.relics[best];
          cam.x = (rl.x0 + rl.x1) / 2; cam.y = (rl.y0 + rl.y1) / 2; cam.z = 1.2 + Math.random() * 1.5;
          return;
        }
      }
      if (sim.n) { const k = Math.floor(Math.random() * sim.n); cam.x = sim.bx[k]; cam.y = sim.by[k]; }
      cam.z = 2 + Math.random() * 5;
    }
    function drift(dt) {
      const input = game.input;
      if (input && input.ptr.size) { cam.idle = 0; return; }
      if ((cam.idle += dt) < 6) return;                   // the player moved it: leave it a while
      if ((cam.t -= dt) <= 0) pickShot();
      const c = game.renderer.cam, k = 1 - Math.exp(-dt / 7);
      c.x += (cam.x - c.x) * k; c.y += (cam.y - c.y) * k; c.z *= Math.pow(cam.z / c.z, k);
      game.renderer.clampCam();
    }
    let barT = 0;
    function showBar() {
      const bar = $('listenBar');
      bar.classList.remove('dim');
      clearTimeout(barT);
      barT = setTimeout(() => bar.classList.add('dim'), 4000);
    }
    m.listen = function (yes) {
      m.listening = yes;
      document.body.classList.toggle('listening', yes);
      $('listenBar').hidden = !yes;
      if (yes) { m.start(); cam.idle = 99; cam.t = 0; showBar(); if (game.ui) game.ui.setOpen(false); }
      else { m.sleep(0); if (m.rec) m.record(); }
    };
    // In Listen mode a tap on the world shows the controls instead of digging.
    m.intercept = function () { if (!m.listening) return false; showBar(); if (m.slept) m.wake(); return true; };

    // Sleep timer: off, 15, 30, 60 minutes. At the end the music fades for a minute and stops.
    const SLEEPS = [0, 15, 30, 60];
    m.sleepAt = 0; m.sleepMin = 0; m.slept = false;
    m.sleep = function (min) {
      m.sleepMin = min;
      m.sleepAt = min ? Date.now() + min * 60000 : 0;
      paintBar();
    };
    m.nextSleep = function () { m.sleep(SLEEPS[(SLEEPS.indexOf(m.sleepMin) + 1) % SLEEPS.length]); };
    m.wake = function () {
      m.slept = false;
      if (m.ctx) m.ctx.resume();
      if (m.eng) m.eng.setVolume(st().vol);
      paintBar();
    };
    function listenTick() {
      if (m.sleepAt && Date.now() >= m.sleepAt && !m.slept) {
        m.slept = true; m.sleepAt = 0; m.sleepMin = 0;
        m.eng.fadeOut(60);
        setTimeout(() => { if (m.slept && m.ctx) m.ctx.suspend(); }, 62000);
        paintBar();
      }
      if (m.rec) paintBar();
    }
    function paintBar() {
      const left = m.sleepAt ? Math.ceil((m.sleepAt - Date.now()) / 60000) : 0;
      $('lsSleep').textContent = m.slept ? 'Asleep · tap to wake' : m.sleepMin ? `Sleep ${left}m` : 'Sleep off';
      const sec = m.rec ? Math.floor((Date.now() - m.rec.t0) / 1000) : 0;
      $('lsRec').textContent = m.rec ? `■ Stop ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}` : '● Record';
      $('lsRec').classList.toggle('on', !!m.rec);
    }

    // Recorder: whatever the music plays, to a file you can keep.
    m.record = function () {
      if (m.rec) { m.rec.r.stop(); return; }
      if (!m.ctx || !m.eng || !window.MediaRecorder || !m.ctx.createMediaStreamDestination) {
        if (game.ui) game.ui.toast('This browser cannot record audio.');
        return;
      }
      const dest = m.ctx.createMediaStreamDestination();
      const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
      let r;
      try { r = new MediaRecorder(dest.stream, type ? { mimeType: type } : undefined); }
      catch (e) { if (game.ui) game.ui.toast('This browser cannot record audio.'); return; }
      const chunks = [];
      r.ondataavailable = ev => { if (ev.data.size) chunks.push(ev.data); };
      r.onstop = () => {
        try { m.eng.out.disconnect(dest); } catch (e) { /* engine changed */ }
        const rec = m.rec; m.rec = null; paintBar();
        const mime = r.mimeType || type || 'audio/webm';
        save(new Blob(chunks, { type: mime }), mime.includes('mp4') ? 'm4a' : 'webm', rec.t0);
      };
      m.eng.out.connect(dest);
      m.rec = { r, dest, t0: Date.now() };
      r.start(1000);
      paintBar();
    };
    async function save(blob, ext, t0) {
      const d = new Date(t0), pad = n => String(n).padStart(2, '0');
      const base = `Stonesong ${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}${pad(d.getMinutes())}`;
      const name = `${base}.${ext}`;
      // Inside the claude.ai viewer, files leave through its downloads capability (which takes
      // .mp4, not .m4a: the same audio either way). Elsewhere: the share sheet, or a download.
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
      if (dl) {
        try { await dl.save({ filename: `${base}.${ext === 'm4a' ? 'mp4' : ext}`, data: blob }); if (game.ui) game.ui.toast('Recording saved', 3000); }
        catch (e) { if (e && e.code !== 'declined' && game.ui) game.ui.toast('Could not save the recording here.', 3600); }
        return;
      }
      try {
        const file = new File([blob], name, { type: blob.type });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
      } catch (e) { if (e && e.name === 'AbortError') return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      if (game.ui) game.ui.toast('Saved ' + name, 3600);
    }

    // The sound button on the main screen opens a little panel: mute (the same switch as
    // "Music from the balls") and the volume (the same as the World tab's slider).
    const SPEAKER = '<path d="M3 8h3l4-3v10l-4-3H3z"/>';
    const ICON_ON = SPEAKER + '<path d="M13 7.5a3.5 3.5 0 0 1 0 5M15.5 5a7 7 0 0 1 0 10"/>';
    const ICON_OFF = SPEAKER + '<path d="M13 8l4 4M17 8l-4 4"/>';
    const svg = body => `<svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
    const volume = () => Math.round((st().vol == null ? 0.8 : st().vol) * 100);
    function muteButton() {
      const off = st().sound === false, b = $('btnMute'), mb = $('volMute');
      b.innerHTML = svg(off ? ICON_OFF : ICON_ON);
      b.classList.toggle('off', off);
      mb.innerHTML = svg(off ? ICON_OFF : ICON_ON);
      mb.classList.toggle('off', off);
      mb.setAttribute('aria-pressed', off);
      mb.setAttribute('aria-label', off ? 'Turn the music on' : 'Mute the music');
      mb.title = mb.getAttribute('aria-label');
      $('volSlider').value = volume(); $('volVal').textContent = volume();
      const box = $('optSound');
      if (box) box.checked = !off;
    }
    function showVolume(open) {
      $('volPop').hidden = !open;
      $('btnMute').setAttribute('aria-expanded', open);
      if (open) muteButton();
    }
    $('btnMute').addEventListener('click', () => showVolume($('volPop').hidden));
    $('volMute').addEventListener('click', () => m.set('sound', st().sound === false));
    $('volSlider').addEventListener('input', e => {
      const v = +e.target.value;
      m.set('vol', v / 100);
      $('volVal').textContent = v;
      if (v > 0 && st().sound === false) m.set('sound', true);   // turning it up means you want to hear it
      const w = $('optVol');
      if (w) w.value = v;
    });
    // A tap anywhere else closes it.
    document.addEventListener('pointerdown', e => {
      if (!$('volPop').hidden && !e.target.closest('#volPop, #btnMute')) showVolume(false);
    }, true);
    m.muteButton = muteButton;
    muteButton();

    // Wire the Listen bar.
    $('btnListen').addEventListener('click', () => m.listen(true));
    $('lsExit').addEventListener('click', () => m.listen(false));
    $('lsSleep').addEventListener('click', () => { if (m.slept) m.wake(); else m.nextSleep(); showBar(); });
    $('lsRec').addEventListener('click', () => { m.record(); showBar(); });
    window.addEventListener('pointerup', m.start, true);
    if (st().tilt) window.addEventListener('pointerup', function once() { window.removeEventListener('pointerup', once, true); tilt(true); }, true);
    return m;
  };
})();

</script>
<script>
// Pixel Quarry: canvas renderer. The world is drawn from 128 px tiles that are
// only re-rendered when the sim marks them dirty, over a half-resolution
// overview image that covers the far zoom levels.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ;
  const D = PQ.DATA, T = D.T, MAT = D.MAT;
  const W = D.W, H = D.H, TL = D.TILE, OV = D.OV, MASK = D.TYPE_MASK;
  const CACHE_MAX = 180;
  const OV_ZOOM = 0.5;                       // below this zoom, draw only the overview

  const pack = (r, g, b) => ((255 << 24) | (Math.min(255, Math.max(0, b | 0)) << 16) | (Math.min(255, Math.max(0, g | 0)) << 8) | Math.min(255, Math.max(0, r | 0))) >>> 0;
  const lerp = (a, b, t) => a + (b - a) * t;

  // The void: open space, and rock that is solid all round (or still unexplored).
  const BG = pack(6, 8, 13), DEEP = pack(3, 4, 7);
  const RELIC_COL = D.MAT[T.RELIC].col, UP_COL = pack(...D.MAT[T.UPGRADE].col);

  // Crystal: the rock is cut into facets, from a 512 px map that tiles (a Voronoi of 8 px cells).
  // A facet's edge (shade 0) catches the light; faces run 1 (dark) .. 7 (bright), lit from the top left.
  const FT = 512, FC = 8;
  function buildFacets() {
    const G = FT / FC, jx = new Float32Array(G * G), jy = new Float32Array(G * G), lum = new Float32Array(G * G);
    let a = 0x2f6b9d3;
    const rnd = () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    for (let g = 0; g < G * G; g++) { jx[g] = 1 + rnd() * (FC - 2); jy[g] = 1 + rnd() * (FC - 2); lum[g] = rnd(); }
    const out = new Uint8Array(FT * FT);
    for (let y = 0; y < FT; y++) for (let x = 0; x < FT; x++) {
      const px = x + 0.5, py = y + 0.5, cx = (x / FC) | 0, cy = (y / FC) | 0;
      let f1 = 1e9, f2 = 1e9, bx = 0, by = 0, bl = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const ux = cx + dx, uy = cy + dy, g = ((uy + G) % G) * G + (ux + G) % G;
        const sx = ux * FC + jx[g], sy = uy * FC + jy[g], d = (px - sx) * (px - sx) + (py - sy) * (py - sy);
        if (d < f1) { f2 = f1; f1 = d; bx = sx; by = sy; bl = lum[g]; } else if (d < f2) f2 = d;
      }
      if (Math.sqrt(f2) - Math.sqrt(f1) < 0.9) { out[y * FT + x] = 0; continue; }
      const lit = Math.max(-1, Math.min(1, ((bx - px) + (by - py)) * 0.7 / (FC * 0.6)));
      out[y * FT + x] = 1 + Math.min(6, ((bl * 0.6 + 0.4 * (0.5 + 0.5 * lit)) * 7) | 0);
    }
    return out;
  }
  const FACET = buildFacets();
  const SHADE = [1, 0.35, 0.47, 0.59, 0.71, 0.83, 0.94, 1.05];

  // index = (type << 5 | poisoned << 4 | crack stage << 2 | glow) << 3 | facet shade.
  // glow 2 = touches open space, 1 = one pixel further in, 0 = deep inside (seen, but dim).
  function buildPalette() {
    const pal = new Uint32Array(16 * 32 * 8).fill(DEEP);
    const face = [0.24, 0.48, 0.8], edge = [0.42, 0.74, 1], white = [0, 0.08, 0.35], crack = [1, 0.8, 0.62, 0.46];
    MAT.forEach(m => {
      if (!m.col) return;
      for (let p = 0; p < 2; p++) for (let st = 0; st < 4; st++) for (let gl = 0; gl < 3; gl++) for (let sh = 0; sh < 8; sh++) {
        let [r, g, b] = m.col.map(c => c * crack[st]);
        if (p) { r = lerp(r, 90, 0.55); g = lerp(g, 255, 0.55); b = lerp(b, 110, 0.55); }
        const k = sh ? face[gl] * SHADE[sh] : edge[gl], w = sh ? 0 : white[gl] * crack[st];
        pal[(((m.id << 5) | (p << 4) | (st << 2) | gl) << 3) | sh] = pack(lerp(r * k, 255, w), lerp(g * k, 255, w), lerp(b * k, 255, w));
      }
    });
    return pal;
  }

  function buildStageLUT() {
    const lut = new Uint8Array(16 * 256);
    MAT.forEach(m => {
      if (!m.hp) return;
      for (let d = 0; d < 256; d++) lut[(m.id << 8) | d] = Math.min(3, (d * 4 / m.hp) | 0);
    });
    return lut;
  }

  function Renderer(canvas, world, sim) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.w = world;
    this.sim = sim;
    this.pal = buildPalette();
    this.stage = buildStageLUT();
    this.relicCol = [];
    for (let f = 0; f < 4; f++) for (let sh = 0; sh < 8; sh++) this.relicCol.push(pack(...RELIC_COL.map(c => lerp(6, c, (f + 1) / 4) * (sh ? 0.55 + 0.45 * SHADE[sh] : 1.05))));
    this.goldCol = pack(255, 214, 64);

    this.cache = new Map();
    this.pool = [];
    this.tileImg = new ImageData(TL, TL);
    this.tileBuf = new Uint32Array(this.tileImg.data.buffer);

    this.ov = document.createElement('canvas');
    this.ov.width = Math.ceil(W / OV); this.ov.height = Math.ceil(H / OV);
    this.ovCtx = this.ov.getContext('2d');
    this.ovImg = new ImageData(TL / OV, TL / OV);
    this.ovBuf = new Uint32Array(this.ovImg.data.buffer);

    this.cam = { x: D.START.x, y: D.START.y, z: 6 };
    this.cssW = 1; this.cssH = 1; this.dpr = 1;
    this.parts = [];
    this.floats = [];
    this.arcs = [];
    this.time = 0;
    this.particles = true;
    this.radar = 0;
    this.safeTop = 0;
    this.safeBottom = 1;

    // Light: the cave is dark, and lit where the music plays (ping), around each ball, and
    // where rock breaks. Drawn at a quarter of the screen's size and smoothed up.
    this.dark = document.createElement('canvas');
    this.darkCtx = this.dark.getContext('2d');
    this.lights = [];
    this.lightMode = 'sound';          // 'sound', or 'full' to light the whole cave
    this.byNotes = false;              // true while the music plays: then notes light the cave
    this.sunlit = 0;                   // extra light while Golden Chord runs (0..1)
    this.lightSprite = sprite('255,255,255');
    this.tints = D.BALLS.map(b => sprite(rgb(b.color))).concat([sprite('109,255,124'), sprite('220,230,255')]);
  }

  const LS = 4;                        // screen px per light-map px
  const MAX_LIGHTS = 320;
  const rgb = hex => [1, 3, 5].map(k => parseInt(hex.slice(k, k + 2), 16)).join(',');
  // A soft round light, white or tinted, 64 px across.
  function sprite(c) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 64;
    const g = cv.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${c},1)`); gr.addColorStop(0.3, `rgba(${c},0.75)`);
    gr.addColorStop(0.65, `rgba(${c},0.25)`); gr.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return cv;
  }

  const R = Renderer.prototype;

  R.resize = function () {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const r = this.canvas.getBoundingClientRect();
    this.cssW = Math.max(1, r.width); this.cssH = Math.max(1, r.height); this.dpr = dpr;
    this.canvas.width = Math.round(this.cssW * dpr);
    this.canvas.height = Math.round(this.cssH * dpr);
    this.dark.width = Math.ceil(this.cssW / LS) + 1;
    this.dark.height = Math.ceil(this.cssH / LS) + 1;
    this.clampCam();
  };

  R.minZoom = function () { return Math.min(this.cssW / W, this.cssH / H) * 0.92; };

  R.clampCam = function () {
    const c = this.cam;
    c.z = Math.min(40, Math.max(this.minZoom(), c.z));
    c.x = Math.min(W, Math.max(0, c.x));
    c.y = Math.min(H, Math.max(0, c.y));
  };

  R.toWorld = function (sx, sy) {
    const c = this.cam;
    return { x: c.x + (sx - this.cssW / 2) / c.z, y: c.y + (sy - this.cssH / 2) / c.z };
  };

  R.pan = function (dx, dy) {
    this.cam.x -= dx / this.cam.z;
    this.cam.y -= dy / this.cam.z;
    this.clampCam();
  };

  R.zoomAt = function (factor, sx, sy) {
    const before = this.toWorld(sx, sy);
    this.cam.z *= factor;
    this.clampCam();
    const after = this.toWorld(sx, sy);
    this.cam.x += before.x - after.x;
    this.cam.y += before.y - after.y;
    this.clampCam();
  };

  R.lookAt = function (x, y, z) {
    this.cam.x = x; this.cam.y = y;
    if (z) this.cam.z = z;
    this.clampCam();
  };

  // The world point at the middle of the open band between the HUD and the shop sheet.
  R.focus = function () {
    return this.toWorld(this.cssW / 2, (this.safeTop + this.safeBottom) / 2);
  };

  // Puts a point in that open band.
  R.lookAtDrop = function (d, z) {
    const zz = z || this.cam.z;
    this.lookAt(d.x, d.y + 0.2 * this.cssH / zz, zz);
  };

  // Fog at a pixel, bilinear between the 4 px fog cells (0 hidden .. 255 seen).
  R.fogAt = function (x, y) {
    const fog = this.w.fog, FW = this.w.FW, FH = this.w.FH;
    const gx = (x + 0.5) / 4 - 0.5, gy = (y + 0.5) / 4 - 0.5;
    let x0 = Math.floor(gx), y0 = Math.floor(gy);
    const fx = gx - x0, fy = gy - y0;
    const x1 = Math.min(FW - 1, x0 + 1), y1 = Math.min(FH - 1, y0 + 1);
    x0 = Math.max(0, x0); y0 = Math.max(0, y0);
    const a = fog[y0 * FW + x0], b = fog[y0 * FW + x1], c = fog[y1 * FW + x0], d = fog[y1 * FW + x1];
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  };

  // How much a rock pixel glows: 2 if it touches open space, 1 if open space is one pixel
  // further (diagonal, or two steps straight), 0 if it is solid all round.
  R.glow = function (i, x, y) {
    const c = this.w.cells;
    if ((x > 0 && !(c[i - 1] & MASK)) || (x < W - 1 && !(c[i + 1] & MASK)) ||
        (y > 0 && !(c[i - W] & MASK)) || (y < H - 1 && !(c[i + W] & MASK))) return 2;
    if (x > 0 && y > 0 && !(c[i - W - 1] & MASK)) return 1;
    if (x < W - 1 && y > 0 && !(c[i - W + 1] & MASK)) return 1;
    if (x > 0 && y < H - 1 && !(c[i + W - 1] & MASK)) return 1;
    if (x < W - 1 && y < H - 1 && !(c[i + W + 1] & MASK)) return 1;
    if ((x > 1 && !(c[i - 2] & MASK)) || (x < W - 2 && !(c[i + 2] & MASK)) ||
        (y > 1 && !(c[i - 2 * W] & MASK)) || (y < H - 2 && !(c[i + 2 * W] & MASK))) return 1;
    return 0;
  };

  // The Golden Pixel looks like the rock around it until something touches its air.
  R.exposed = function (x, y) {
    const cells = this.w.cells, i = y * W + x;
    return (x > 0 && !(cells[i - 1] & MASK)) || (x < W - 1 && !(cells[i + 1] & MASK)) ||
           (y > 0 && !(cells[i - W] & MASK)) || (y < H - 1 && !(cells[i + W] & MASK));
  };

  // Colour of one cell as drawn. fog: 0..255 for its fog cell.
  R.pixel = function (i, x, y, fog) {
    const cells = this.w.cells, c = cells[i], t = c & MASK;
    if (t === T.UPGRADE) return UP_COL;                  // seen through the dark
    if (fog < 96) return DEEP;
    if (!t) return BG;
    const f = fog >= 255 ? 3 : (fog - 96) * 4 / 160 | 0;
    const fi = ((y & (FT - 1)) << 9) | (x & (FT - 1));
    if (t === T.RELIC) return this.relicCol[(f << 3) | FACET[fi]];
    let tt = t;
    if (t === T.GOLD) {
      if (this.exposed(x, y)) return this.goldCol;
      const left = cells[i - 1] & MASK;
      tt = left && left !== T.GOLD && left !== T.RELIC && left !== T.UPGRADE ? left : T.BASALT;
    }
    const gl = this.glow(i, x, y);
    if (!gl && f < 3) return DEEP;
    const d = this.w.dmg[i];
    return this.pal[(((tt << 5) | ((c >> 7) << 4) | ((d && t !== T.GOLD ? this.stage[(tt << 8) | d] : 0) << 2) | (f < 2 && gl === 2 ? 1 : gl)) << 3) | FACET[fi]];
  };

  // Ignoring fog (the relic preview uses this).
  R.cellColor = function (i, x, y) { return this.pixel(i, x, y, 255); };

  R.renderTile = function (tx, ty, ctx) {
    const x0 = tx * TL, y0 = ty * TL, w = Math.min(TL, W - x0), h = Math.min(TL, H - y0);
    const buf = this.tileBuf, fog = this.w.fog, FW = this.w.FW;
    for (let yy = 0; yy < h; yy++) {
      const y = y0 + yy, row = y * W, o = yy * TL, frow = (y >> 2) * FW;
      for (let xx = 0; xx < w; xx++) {
        const x = x0 + xx;
        buf[o + xx] = this.pixel(row + x, x, y, fog[frow + (x >> 2)]);
      }
    }
    ctx.putImageData(this.tileImg, 0, 0, 0, 0, w, h);
  };

  // Overview pixels keep the brightest of the cells they cover, so thin glowing edges survive.
  R.renderOvBlock = function (tx, ty) {
    const B = TL / OV, x0 = tx * TL, y0 = ty * TL;
    const w = Math.min(B, Math.ceil((W - x0) / OV)), h = Math.min(B, Math.ceil((H - y0) / OV));
    const buf = this.ovBuf, fog = this.w.fog, FW = this.w.FW;
    for (let oy = 0; oy < h; oy++) {
      for (let ox = 0; ox < w; ox++) {
        let best = DEEP, lum = -1;
        for (let sy = 0; sy < OV; sy++) {
          const y = y0 + oy * OV + sy;
          if (y >= H) continue;
          for (let sx = 0; sx < OV; sx++) {
            const x = x0 + ox * OV + sx;
            if (x >= W) continue;
            const c = this.pixel(y * W + x, x, y, fog[(y >> 2) * FW + (x >> 2)]);
            const l = (c & 255) + ((c >> 8) & 255) + ((c >> 16) & 255);
            if (l > lum) { lum = l; best = c; }
          }
        }
        buf[oy * B + ox] = best;
      }
    }
    this.ovCtx.putImageData(this.ovImg, tx * B, ty * B, 0, 0, w, h);
  };

  // Rebuild every overview block (used once while loading). Returns a promise.
  R.buildOverview = async function (onProgress) {
    const sim = this.sim, tx = sim.tilesX, ty = sim.tilesY;
    for (let y = 0; y < ty; y++) {
      for (let x = 0; x < tx; x++) { this.renderOvBlock(x, y); sim.ovDirty[y * tx + x] = 0; }
      if (onProgress) onProgress((y + 1) / ty);
      if (y % 4 === 3) await new Promise(r => setTimeout(r, 0));
    }
  };

  R.getTile = function (k) {
    let e = this.cache.get(k);
    if (e) { this.cache.delete(k); this.cache.set(k, e); return e; }
    if (this.cache.size >= CACHE_MAX) {
      const oldK = this.cache.keys().next().value;
      this.pool.push(this.cache.get(oldK));
      this.cache.delete(oldK);
    }
    e = this.pool.pop();
    if (!e) {
      const cv = document.createElement('canvas');
      cv.width = TL; cv.height = TL;
      e = { cv, ctx: cv.getContext('2d') };
    }
    e.fresh = true;
    this.cache.set(k, e);
    return e;
  };

  R.draw = function (dt) {
    this.time += dt;
    const ctx = this.ctx, c = this.cam, z = c.z, dpr = this.dpr, sim = this.sim;
    const hw = this.cssW / 2, hh = this.cssH / 2;
    const toDX = wx => Math.round(((wx - c.x) * z + hw) * dpr);
    const toDY = wy => Math.round(((wy - c.y) * z + hh) * dpr);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#080b09';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    const vx0 = Math.max(0, c.x - hw / z), vx1 = Math.min(W, c.x + hw / z);
    const vy0 = Math.max(0, c.y - hh / z), vy1 = Math.min(H, c.y + hh / z);
    const tx0 = Math.floor(vx0 / TL), tx1 = Math.min(sim.tilesX - 1, Math.floor((vx1 - 0.001) / TL));
    const ty0 = Math.floor(vy0 / TL), ty1 = Math.min(sim.tilesY - 1, Math.floor((vy1 - 0.001) / TL));
    const visible = [];
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) visible.push(ty * sim.tilesX + tx);
    const useOv = z < OV_ZOOM || visible.length > CACHE_MAX - 20;
    // Redraws get a time budget per frame and take turns, so a slow phone
    // refreshes busy areas less often instead of dropping frames.
    const rot = this.rot = (this.rot + 7) | 0;
    const order = k => visible[(k + rot) % visible.length];

    // Overview: refresh what is in view, then draw it as the backdrop.
    let deadline = performance.now() + (useOv ? 5 : 1.5);
    for (let q = 0; q < visible.length && performance.now() < deadline; q++) {
      const k = order(q);
      if (sim.ovDirty[k]) { this.renderOvBlock(k % sim.tilesX, (k / sim.tilesX) | 0); sim.ovDirty[k] = 0; }
    }
    {
      const dx0 = toDX(vx0), dy0 = toDY(vy0), dx1 = toDX(vx1), dy1 = toDY(vy1);
      ctx.drawImage(this.ov, vx0 / OV, vy0 / OV, (vx1 - vx0) / OV, (vy1 - vy0) / OV, dx0, dy0, dx1 - dx0, dy1 - dy0);
    }

    if (!useOv) {
      deadline = performance.now() + 6;
      for (let q = 0; q < visible.length; q++) {
        const k = order(q);
        if (this.cache.has(k) && !sim.tileDirty[k]) continue;
        if (performance.now() > deadline) continue;
        this.renderTile(k % sim.tilesX, (k / sim.tilesX) | 0, this.getTile(k).ctx);
        sim.tileDirty[k] = 0;
      }
      for (const k of visible) {
        if (!this.cache.has(k)) continue;        // not drawn yet: the overview shows through
        const e = this.getTile(k);
        const x0 = (k % sim.tilesX) * TL, y0 = ((k / sim.tilesX) | 0) * TL;
        const w = Math.min(TL, W - x0), h = Math.min(TL, H - y0);
        const dx0 = toDX(x0), dy0 = toDY(y0);
        ctx.drawImage(e.cv, 0, 0, w, h, dx0, dy0, toDX(x0 + w) - dx0, toDY(y0 + h) - dy0);
      }
    }

    this.senseBreaks(vx0, vy0, vx1, vy1);
    this.drawLight(ctx, toDX, toDY, vx0, vy0, vx1, vy1);
    this.drawUpgrades(ctx, toDX, toDY, vx0, vy0, vx1, vy1);
    this.drawGold(ctx, toDX, toDY, vx0, vy0, vx1, vy1);
    this.drawParticles(ctx, dt, toDX, toDY, vx0, vy0, vx1, vy1);
    this.drawAbilities(ctx, toDX, toDY, vx0, vy0, vx1, vy1);
    this.drawBalls(ctx, toDX, toDY, vx0, vy0, vx1, vy1);
    this.drawArcs(ctx, dt, toDX, toDY);
    this.drawDrop(ctx, toDX, toDY);
    this.drawFloats(ctx, dt, toDX, toDY);
    if (this.radar >= 2 && !sim.s.found) this.drawZone(ctx, toDX, toDY);
    if (sim.last && sim.last.length) this.drawLast(ctx, toDX, toDY, vx0, vy0, vx1, vy1);
  };

  // A light where a note sounds. kind: ball type (D.BALLS.length = the pickaxe, +1 = plain
  // white); power 0..1; delay in s, so the light lands with the note, not before it.
  R.ping = function (x, y, kind, power, delay) {
    if (this.lights.length >= MAX_LIGHTS) this.lights.shift();
    this.lights.push({ x, y, k: kind, p: Math.min(1, power), at: this.time + (delay || 0) });
  };

  // Rock breaking glints. Without music it is the only light from hits, so it shines brighter.
  R.senseBreaks = function (vx0, vy0, vx1, vy1) {
    const sim = this.sim, white = D.BALLS.length + 1, p = this.byNotes ? 0.14 : 0.4;
    const every = this.byNotes ? 3 : 1;
    // A few a frame: a Drone or a Gong breaks dozens at once, and stacked glints white out.
    for (let f = 0, made = 0; f < sim.fxn && made < 6; f += every) {
      if (this.lights.length > MAX_LIGHTS - 40) break;
      const i = sim.fxI[f], x = i % W, y = (i / W) | 0;
      if (x < vx0 || x > vx1 || y < vy0 || y > vy1) continue;
      this.ping(x + 0.5, y + 0.5, white, p, 0);
      made++;
    }
  };

  R.drawLight = function (ctx, toDX, toDY, vx0, vy0, vx1, vy1) {
    const c = this.cam, z = c.z, dpr = this.dpr, now = this.time, hw = this.cssW / 2, hh = this.cssH / 2;
    const live = [];
    for (const l of this.lights) {
      const life = 0.45 + 0.7 * l.p, age = now - l.at;
      if (age < life) live.push(l);
    }
    this.lights = live;
    // How bright a light is right now: a quick rise, then a long fade like a ringing note.
    const level = l => {
      const age = now - l.at, life = 0.45 + 0.7 * l.p;
      if (age < 0) return 0;
      return age < 0.03 ? age / 0.03 : Math.pow(1 - (age - 0.03) / (life - 0.03), 1.6);
    };
    const m = 30 / z;

    if (this.lightMode !== 'full') {
      const dc = this.darkCtx, dw = this.dark.width, dh = this.dark.height;
      const zt = Math.min(1, Math.max(0, (z - 0.4) / 3));
      const amb = (0.4 + 0.34 * zt) * (1 - 0.5 * this.sunlit);
      const sx = wx => ((wx - c.x) * z + hw) / LS, sy = wy => ((wy - c.y) * z + hh) / LS;
      dc.globalCompositeOperation = 'source-over';
      dc.clearRect(0, 0, dw, dh);
      dc.fillStyle = `rgba(2,3,6,${amb.toFixed(3)})`;
      dc.fillRect(0, 0, dw, dh);
      dc.globalCompositeOperation = 'destination-out';
      // Every ball carries a little light (a sample of them, in a big swarm).
      const sim = this.sim, n = sim.n, bx = sim.bx, by = sim.by;
      const br = Math.max(4, 9 * z) / LS, step = Math.max(1, Math.ceil(n / 700));
      dc.globalAlpha = 0.6;
      for (let k = (this.rot % step); k < n; k += step) {
        const x = bx[k], y = by[k];
        if (x < vx0 - m || x > vx1 + m || y < vy0 - m || y > vy1 + m) continue;
        dc.drawImage(this.lightSprite, sx(x) - br, sy(y) - br, br * 2, br * 2);
      }
      for (const l of live) {
        if (l.x < vx0 - m || l.x > vx1 + m || l.y < vy0 - m || l.y > vy1 + m) continue;
        const a = level(l);
        if (a <= 0.01) continue;
        const r = Math.max(7, (8 + 16 * l.p) * z) / LS;
        dc.globalAlpha = Math.min(1, a * (0.5 + 0.6 * l.p));
        dc.drawImage(this.lightSprite, sx(l.x) - r, sy(l.y) - r, r * 2, r * 2);
      }
      dc.globalAlpha = 1;
      dc.globalCompositeOperation = 'source-over';
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(this.dark, 0, 0, dw, dh, 0, 0, dw * LS * dpr, dh * LS * dpr);
      ctx.imageSmoothingEnabled = false;
    }

    // Each note tints the crystal around it in its ball's colour, and a strong one glints.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const glint = [];
    for (const l of live) {
      if (l.x < vx0 - m || l.x > vx1 + m || l.y < vy0 - m || l.y > vy1 + m) continue;
      const a = level(l);
      if (a <= 0.03) continue;
      const r = Math.max(5, (5 + 10 * l.p) * z) * dpr, cx = toDX(l.x), cy = toDY(l.y);
      ctx.globalAlpha = a * (0.1 + 0.22 * l.p);
      ctx.drawImage(this.tints[l.k] || this.lightSprite, cx - r, cy - r, r * 2, r * 2);
      if (l.p > 0.5 && z >= 1.5 && now - l.at < 0.35) glint.push(cx, cy, a, r);
    }
    if (glint.length) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = Math.max(1, dpr);
      for (let q = 0; q < glint.length; q += 4) {
        const cx = glint[q], cy = glint[q + 1], len = glint[q + 3] * 0.55 * glint[q + 2];
        ctx.globalAlpha = glint[q + 2] * 0.8;
        ctx.beginPath();
        ctx.moveTo(cx - len, cy); ctx.lineTo(cx + len, cy);
        ctx.moveTo(cx, cy - len); ctx.lineTo(cx, cy + len);
        ctx.stroke();
      }
    }
    ctx.restore();
  };

  // The last pixels of rock in the world, ringed so they can be found at any zoom.
  R.drawLast = function (ctx, toDX, toDY, vx0, vy0, vx1, vy1) {
    const list = this.sim.last, dpr = this.dpr, m = 12 / this.cam.z;
    const pulse = 0.5 + 0.5 * Math.sin(this.time * 4);
    const r = (4 + 3 * pulse) * dpr;
    ctx.lineWidth = 1.5 * dpr;
    ctx.strokeStyle = `rgba(120,240,255,${0.5 + 0.4 * pulse})`;
    ctx.beginPath();
    for (const i of list) {
      const x = i % W, y = (i / W) | 0;
      if (x < vx0 - m || x > vx1 + m || y < vy0 - m || y > vy1 + m) continue;
      const cx = toDX(x + 0.5), cy = toDY(y + 0.5);
      ctx.rect(cx - r, cy - r, r * 2, r * 2);
    }
    ctx.stroke();
  };

  // What the balls do, drawn under them: Gong rings, String strings, Echo ghosts, the Drone's
  // hum, and the chord notes shimmering around a Harmonic.
  const BK = {};
  D.BALLS.forEach((b, i) => { BK[b.key] = i; });
  R.drawAbilities = function (ctx, toDX, toDY, vx0, vy0, vx1, vy1) {
    const sim = this.sim, z = this.cam.z, dpr = this.dpr, n = sim.n, bt = sim.bt, bx = sim.bx, by = sim.by, m = 60 / z;
    const inView = (x, y, pad) => x > vx0 - pad && x < vx1 + pad && y > vy0 - pad && y < vy1 + pad;
    ctx.save();
    ctx.lineCap = 'round';
    // Gong: rings of sound, fading as they spread.
    ctx.strokeStyle = D.BALLS[BK.bomb].color;
    ctx.lineWidth = Math.max(1, 1.2 * dpr);
    for (const g of sim.rings) {
      if (!inView(g.x, g.y, g.R)) continue;
      ctx.globalAlpha = 0.75 * (1 - g.r / g.R);
      ctx.beginPath();
      ctx.arc(toDX(g.x), toDY(g.y), g.r * z * dpr, 0, Math.PI * 2);
      ctx.stroke();
    }
    // String: a line between each pair, trembling; slack and faint when too far apart to cut.
    const L = sim.stringLen, pt = sim.partner, wob = Math.sin(this.time * 38);
    ctx.strokeStyle = D.BALLS[BK.spark].color;
    for (let k = 0; k < n; k++) {
      const j = pt[k];
      if (bt[k] !== BK.spark || j < k) continue;
      const x0 = bx[k], y0 = by[k], x1 = bx[j], y1 = by[j], d = Math.hypot(x1 - x0, y1 - y0);
      if (!inView(x0, y0, m) && !inView(x1, y1, m)) continue;
      const taut = d <= L;
      ctx.globalAlpha = taut ? 0.8 : 0.18;
      ctx.lineWidth = Math.max(1, (taut ? 1.3 : 0.8) * dpr);
      const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, a = taut ? wob * Math.min(3, d * 0.06) : 0;
      const nx = d ? -(y1 - y0) / d : 0, ny = d ? (x1 - x0) / d : 0;
      ctx.beginPath();
      ctx.moveTo(toDX(x0), toDY(y0));
      ctx.quadraticCurveTo(toDX(mx + nx * a), toDY(my + ny * a), toDX(x1), toDY(y1));
      ctx.stroke();
    }
    // Echo: a ghost where each one was a second ago.
    const gs = Math.max(2, Math.min(6, z * 0.9)) * dpr;
    ctx.strokeStyle = D.BALLS[BK.venom].color;
    ctx.lineWidth = Math.max(1, dpr);
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    for (let k = 0; k < n; k++) {
      if (bt[k] !== BK.venom) continue;
      const g = sim.ghost(k);
      if (!inView(g.x, g.y, 4)) continue;
      ctx.rect(toDX(g.x) - gs / 2, toDY(g.y) - gs / 2, gs, gs);
    }
    ctx.stroke();
    // Drone: its hum, a soft ring breathing in and out.
    ctx.strokeStyle = D.BALLS[BK.drill].color;
    ctx.globalAlpha = 0.3 + 0.15 * Math.sin(this.time * 6);
    ctx.beginPath();
    const hr = (sim.humR + 0.5) * z * dpr;
    for (let k = 0; k < n; k++) {
      if (bt[k] !== BK.drill || !inView(bx[k], by[k], sim.humR)) continue;
      const cx = toDX(bx[k]), cy = toDY(by[k]);
      ctx.moveTo(cx + hr, cy);
      ctx.arc(cx, cy, hr, 0, Math.PI * 2);
    }
    ctx.stroke();
    // Harmonic: rock near it whose note is in the chord shimmers gold.
    if (z >= 2) {
      const cells = this.w.cells, R = 9, sz = Math.max(1, z * 0.45) * dpr;
      ctx.fillStyle = '#ffd640';
      ctx.globalAlpha = 0.35 + 0.2 * Math.sin(this.time * 5);
      let shown = 0;
      for (let k = 0; k < n && shown < 40; k++) {
        if (bt[k] !== BK.midas || !inView(bx[k], by[k], R)) continue;
        shown++;
        const cx = bx[k] | 0, cy = by[k] | 0;
        for (let y = cy - R; y <= cy + R; y++) for (let x = cx - R; x <= cx + R; x++) {
          if (x < 0 || y < 0 || x >= W || y >= H) continue;
          const i = y * W + x, t = cells[i] & MASK;
          if (!t || t === T.RELIC || this.glow(i, x, y) !== 2 || !sim.inChord(x, y)) continue;
          ctx.fillRect(toDX(x + 0.5) - sz / 2, toDY(y + 0.5) - sz / 2, sz, sz);
        }
      }
    }
    ctx.restore();
  };

  // Balls are small squares with a fading streak behind them.
  R.drawBalls = function (ctx, toDX, toDY, vx0, vy0, vx1, vy1) {
    const sim = this.sim, n = sim.n, bx = sim.bx, by = sim.by, VX = sim.vx, VY = sim.vy, bt = sim.bt, z = this.cam.z, dpr = this.dpr;
    const size = Math.max(2, Math.min(6, z * 0.9)) * dpr, half = size / 2;
    const m = 14 / z, trail = Math.min(10, 26 / z);    // trail length in world px: ~26 screen px, at most 10 world px
    ctx.lineWidth = Math.max(1, size * 0.45);
    ctx.lineCap = 'round';
    for (let t = 0; t < D.BALLS.length; t++) {
      const col = D.BALLS[t].color;
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      for (let k = 0; k < n; k++) {
        if (bt[k] !== t) continue;
        const x = bx[k], y = by[k];
        if (x < vx0 - m || x > vx1 + m || y < vy0 - m || y > vy1 + m) continue;
        const len = trail * sim.tSpd[t] / 60;
        ctx.moveTo(toDX(x - VX[k] * len), toDY(y - VY[k] * len));
        ctx.lineTo(toDX(x), toDY(y));
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = col;
      for (let k = 0; k < n; k++) {
        if (bt[k] !== t) continue;
        const x = bx[k], y = by[k];
        if (x < vx0 - m || x > vx1 + m || y < vy0 - m || y > vy1 + m) continue;
        ctx.fillRect(toDX(x) - half, toDY(y) - half, size, size);
      }
    }
    ctx.lineCap = 'butt';
  };

  // Lightning arcs: a jagged purple line, gone in a moment.
  R.drawArcs = function (ctx, dt, toDX, toDY) {
    const fx = this.sim.arcFx;
    for (let q = 0; q + 3 < fx.length; q += 4) {
      if (this.arcs.length < 120) this.arcs.push({ x0: fx[q], y0: fx[q + 1], x1: fx[q + 2], y1: fx[q + 3], life: 0.16 });
      if (q % 8 === 0) this.ping(fx[q + 2], fx[q + 3], D.BALLS.findIndex(b => b.key === 'spark'), 0.5, 0);
    }
    fx.length = 0;
    if (!this.arcs.length) return;
    const dpr = this.dpr, keep = [];
    ctx.save();
    ctx.lineJoin = 'round';
    for (const a of this.arcs) {
      a.life -= dt;
      if (a.life <= 0) continue;
      keep.push(a);
      const dx = a.x1 - a.x0, dy = a.y1 - a.y0, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
      ctx.beginPath();
      ctx.moveTo(toDX(a.x0), toDY(a.y0));
      for (let k = 1; k < 4; k++) {
        const j = (Math.random() - 0.5) * L * 0.35;
        ctx.lineTo(toDX(a.x0 + dx * k / 4 + nx * j), toDY(a.y0 + dy * k / 4 + ny * j));
      }
      ctx.lineTo(toDX(a.x1), toDY(a.y1));
      ctx.globalAlpha = Math.min(1, a.life * 8);
      ctx.strokeStyle = '#a35cff'; ctx.lineWidth = 3 * dpr; ctx.stroke();
      ctx.strokeStyle = '#efe0ff'; ctx.lineWidth = 1 * dpr; ctx.stroke();
    }
    ctx.restore();
    this.arcs = keep;
  };

  // Upgrade pixels glow through the dark at every zoom, so they can be aimed for.
  R.drawUpgrades = function (ctx, toDX, toDY, vx0, vy0, vx1, vy1) {
    const list = this.w.upgrades, cells = this.w.cells, dpr = this.dpr, z = this.cam.z;
    if (!list) return;
    const pulse = 0.75 + 0.25 * Math.sin(this.time * 3);
    const size = Math.max(2 * dpr, z * dpr), half = size / 2;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ff40e0';
    for (let q = 0; q < list.length; q++) {
      const i = list[q];
      if ((cells[i] & MASK) !== T.UPGRADE) continue;
      const x = i % W, y = (i / W) | 0;
      if (x < vx0 - 2 || x > vx1 + 2 || y < vy0 - 2 || y > vy1 + 2) continue;
      ctx.fillRect(toDX(x + 0.5) - half, toDY(y + 0.5) - half, size, size);
    }
    ctx.globalAlpha = 1;
  };

  R.drawParticles = function (ctx, dt, toDX, toDY, vx0, vy0, vx1, vy1) {
    const sim = this.sim, z = this.cam.z;
    if (this.particles && z >= 1.5) {
      for (let f = 0; f < sim.fxn && this.parts.length < 320; f++) {
        const i = sim.fxI[f], x = i % W, y = (i / W) | 0;
        if (x < vx0 || x > vx1 || y < vy0 || y > vy1) continue;
        const col = MAT[sim.fxT[f]].col;
        this.parts.push({ x: x + 0.5, y: y + 0.5, vx: (Math.random() - 0.5) * 30, vy: -Math.random() * 25 - 5, life: 0.5 + Math.random() * 0.3,
          col: `rgb(${col[0]},${col[1]},${col[2]})` });
      }
    }
    sim.fxn = 0;
    const size = Math.max(1, z * 0.7) * this.dpr;
    const keep = [];
    for (const p of this.parts) {
      p.life -= dt;
      if (p.life <= 0) continue;
      p.vy += 90 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.fillStyle = p.col;
      ctx.fillRect(toDX(p.x) - size / 2, toDY(p.y) - size / 2, size, size);
      keep.push(p);
    }
    ctx.globalAlpha = 1;
    this.parts = keep;
  };

  R.drawGold = function (ctx, toDX, toDY, vx0, vy0, vx1, vy1) {
    const s = this.sim.s, g = this.w.gold;
    if (s.found || g.x < vx0 - 20 || g.x > vx1 + 20 || g.y < vy0 - 20 || g.y > vy1 + 20) return;
    if (!this.exposed(g.x, g.y) || this.fogAt(g.x, g.y) < 128) return;
    const cx = toDX(g.x + 0.5), cy = toDY(g.y + 0.5), dpr = this.dpr;
    const pulse = 0.5 + 0.5 * Math.sin(this.time * 5);
    ctx.strokeStyle = `rgba(255,214,64,${0.45 + 0.5 * pulse})`;
    ctx.lineWidth = 2 * dpr;
    const r = (10 + 6 * pulse) * dpr;
    ctx.strokeRect(cx - r, cy - r, r * 2, r * 2);
  };

  // "+bits" numbers that drift up from a tap and fade.
  R.float = function (x, y, text) {
    if (this.floats.length > 24) this.floats.shift();
    this.floats.push({ x, y, text, t: 0 });
  };
  R.drawFloats = function (ctx, dt, toDX, toDY) {
    if (!this.floats.length) return;
    const dpr = this.dpr, keep = [];
    ctx.save();
    ctx.font = `700 ${16 * dpr}px 'PQ Digits', 'Pixelify Sans', sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 3 * dpr;
    ctx.strokeStyle = 'rgba(11,10,16,0.85)';
    for (const f of this.floats) {
      f.t += dt;
      if (f.t > 1) continue;
      const x = toDX(f.x), y = toDY(f.y) - (12 + 36 * f.t) * dpr;
      ctx.globalAlpha = f.t < 0.6 ? 1 : 1 - (f.t - 0.6) / 0.4;
      ctx.strokeText(f.text, x, y);
      ctx.fillStyle = '#ffd640';
      ctx.fillText(f.text, x, y);
      keep.push(f);
    }
    ctx.restore();
    this.floats = keep;
  };

  // The launcher: a green arrow pointing where new balls fire.
  R.drawDrop = function (ctx, toDX, toDY) {
    const d = this.sim.s.drop, dpr = this.dpr, a = this.sim.s.aim;
    ctx.save();
    ctx.translate(toDX(d.x), toDY(d.y));
    ctx.rotate(a);
    ctx.scale(dpr, dpr);
    ctx.beginPath();
    ctx.moveTo(13, 0); ctx.lineTo(-6, -8); ctx.lineTo(-2, 0); ctx.lineTo(-6, 8); ctx.closePath();
    ctx.fillStyle = 'rgba(8,11,9,0.85)';
    ctx.fill();
    ctx.lineWidth = 1.6;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#6dff7c';
    ctx.stroke();
    ctx.restore();
  };

  // The radar's search ring: the gold is somewhere inside it.
  R.drawZone = function (ctx, toDX, toDY) {
    const zn = this.sim.radarZone(this.radar), dpr = this.dpr;
    if (!zn) return;
    const cx = toDX(zn.x), cy = toDY(zn.y), r = zn.r * this.cam.z * dpr;
    ctx.save();
    ctx.lineWidth = 2 * dpr;
    ctx.setLineDash([7 * dpr, 6 * dpr]);
    ctx.lineDashOffset = -this.time * 8 * dpr;
    ctx.strokeStyle = 'rgba(11,10,16,0.7)';
    ctx.beginPath(); ctx.arc(cx, cy, r + dpr, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,214,64,0.85)';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  };

  PQ.Renderer = Renderer;
})();
